spring.application.name=webhook-platform

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
resilience4j.circuitbreaker.instances.webhookDelivery.sliding-window-size=10
resilience4j.circuitbreaker.instances.webhookDelivery.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.webhookDelivery.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.webhookDelivery.permitted-number-of-calls-in-half-open-state=3