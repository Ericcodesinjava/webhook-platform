spring.application.name=webhook-platform
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
resilience4j.circuitbreaker.configs.webhookDelivery.sliding-window-size=10
resilience4j.circuitbreaker.configs.webhookDelivery.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.webhookDelivery.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.webhookDelivery.permitted-number-of-calls-in-half-open-state=3
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=webhook-delivery
spring.kafka.consumer.auto-offset-reset=earliest
# Redis: default address when running from IntelliJ (Docker overrides the host)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
app.rate-limit.per-minute=100